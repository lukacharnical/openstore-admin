<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OpenStore Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              500: "#6366f1", 600: "#4f46e5", 700: "#4338ca"
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #090d16;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans pb-6">

  <!-- En-tête Mobile -->
  <header class="sticky top-0 z-40 glass-card px-4 py-3.5 border-b border-slate-800/80 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Admin OpenStore</h1>
        <p id="statusText" class="text-[11px] text-slate-400">Prêt à la connexion</p>
      </div>
    </div>
    <button id="logoutBtn" hidden class="p-2.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 active:scale-95 transition">
      <i data-lucide="log-out" class="w-4 h-4"></i>
    </button>
  </header>

  <main class="flex-1 px-4 py-5 max-w-lg mx-auto w-full">

    <!-- ECRAN DE CONNEXION -->
    <section id="loginScreen" class="py-6 space-y-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold">Espace Administrateur</h2>
        <p class="text-xs text-slate-400">Connectez-vous avec vos identifiants OpenStore habituels</p>
      </div>

      <form id="loginForm" class="glass-card p-5 rounded-2xl space-y-4 shadow-xl">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Adresse E-mail</label>
          <input id="loginEmail" type="email" required autocomplete="username" placeholder="psbx51800@gmail.com"
            class="w-full p-3 rounded-xl glass-input text-sm text-white placeholder-slate-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Mot de passe</label>
          <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••"
            class="w-full p-3 rounded-xl glass-input text-sm text-white placeholder-slate-500">
        </div>

        <p id="loginError" hidden class="text-xs text-rose-400 bg-rose-500/10 p-3 rounded-xl border border-rose-500/20"></p>

        <button type="submit" id="loginSubmitBtn"
          class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] font-semibold text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <i data-lucide="key-round" class="w-4 h-4"></i>
          <span>Se connecter</span>
        </button>
      </form>
    </section>

    <!-- PANNEAU D'ADMINISTRATION MOBILE -->
    <section id="adminDashboard" hidden class="space-y-5">
      
      <!-- Profil connecté -->
      <div class="glass-card p-4 rounded-2xl flex items-center justify-between border-l-4 border-indigo-500">
        <div class="min-w-0 pr-2">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">Connecté en tant que</p>
          <p id="adminEmailLabel" class="text-sm font-bold text-white truncate"></p>
        </div>
        <span class="px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold border border-indigo-500/30 shrink-0">
          ADMIN
        </span>
      </div>

      <!-- Formulaire de création complète d'utilisateur -->
      <div class="glass-card p-4 rounded-2xl space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i>
          Créer un nouveau compte
        </h3>

        <form id="addUserForm" class="space-y-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">E-mail utilisateur</label>
            <input id="newUserEmail" type="email" required placeholder="nom@exemple.com"
              class="w-full p-2.5 rounded-xl glass-input text-xs text-white placeholder-slate-500">
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Mot de passe (6 car. min)</label>
            <input id="newUserPassword" type="text" minlength="6" required placeholder="Définir un mot de passe"
              class="w-full p-2.5 rounded-xl glass-input text-xs text-white placeholder-slate-500 font-mono">
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Rôle attribué</label>
            <select id="newUserRole" class="w-full p-2.5 rounded-xl glass-input text-xs text-white bg-slate-900">
              <option value="ami">Ami</option>
              <option value="invite">Invité</option>
              <option value="testeur">Testeur</option>
              <option value="codeur">Codeur</option>
              <option value="programmeur">Programmeur</option>
              <option value="admin">Administrateur</option>
            </select>
          </div>

          <button type="submit" id="addUserBtn" class="w-full py-2.5 rounded-xl bg-indigo-600 active:scale-95 text-xs font-bold transition flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>Créer et activer le compte</span>
          </button>
        </form>
      </div>

      <!-- Liste des utilisateurs -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Comptes enregistrés</h3>
          <span id="userCountBadge" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
        </div>

        <div id="usersContainer" class="space-y-2.5">
          <p class="text-xs text-slate-500 text-center py-4">Chargement des comptes...</p>
        </div>
      </div>

    </section>

  </main>

  <!-- JS FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBd_NPKinJ6Vu4Wk_98rNaM75NBNMaGdo",
      authDomain: "openstore-be393.firebaseapp.com",
      databaseURL: "https://openstore-be393-default-rtdb.firebaseio.com",
      projectId: "openstore-be393",
      storageBucket: "openstore-be393.firebasestorage.app",
      messagingSenderId: "615451083226",
      appId: "1:615451083226:web:2ccfdad00c8474088180e3",
      measurementId: "G-1CRYGEK1G0"
    };

    // App principale
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Instance Firebase secondaire dédiée à la création de comptes sans déconnecter l'Admin
    const secondaryApp = initializeApp(firebaseConfig, "SecondaryAuthApp");
    const secondaryAuth = getAuth(secondaryApp);

    const $ = id => document.getElementById(id);

    function emailKey(email) {
      return email.toLowerCase().replace(/[^a-z0-9]/g, "_");
    }

    async function checkAdminRole(email) {
      const key = emailKey(email);
      const snapshot = await get(ref(db, "store_users/" + key));
      if (snapshot.exists()) {
        const val = snapshot.val();
        return val.role === "admin";
      }
      return false;
    }

    onAuthStateChanged(auth, async user => {
      if (user) {
        const email = user.email.toLowerCase();
        $("statusText").textContent = "Vérification des droits...";
        
        const isAdmin = await checkAdminRole(email);

        if (!isAdmin) {
          $("statusText").textContent = "Accès refusé";
          alert("Accès réservé aux administrateurs.");
          await signOut(auth);
          return;
        }

        $("loginScreen").hidden = true;
        $("adminDashboard").hidden = false;
        $("logoutBtn").hidden = false;
        $("adminEmailLabel").textContent = email;
        $("statusText").textContent = "Connecté (En direct)";
        
        listenToUsers();
      } else {
        $("loginScreen").hidden = false;
        $("adminDashboard").hidden = true;
        $("logoutBtn").hidden = true;
        $("statusText").textContent = "Prêt à la connexion";
      }
    });

    $("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const errorBox = $("loginError");

      errorBox.hidden = true;
      $("loginSubmitBtn").disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorBox.textContent = "Erreur : E-mail ou mot de passe incorrect.";
        errorBox.hidden = false;
      } finally {
        $("loginSubmitBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", () => signOut(auth));

    function listenToUsers() {
      onValue(ref(db, "store_users"), snapshot => {
        const container = $("usersContainer");
        container.innerHTML = "";

        if (!snapshot.exists()) {
          container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Aucun utilisateur.</p>';
          $("userCountBadge").textContent = "0";
          return;
        }

        const data = snapshot.val();
        const users = Object.entries(data);
        $("userCountBadge").textContent = users.length;

        users.forEach(([key, user]) => {
          const card = document.createElement("div");
          card.className = "glass-card p-3 rounded-xl flex items-center justify-between gap-2";

          const username = user.username || key;
          const currentRole = user.role || "ami";

          card.innerHTML = `
            <div class="min-w-0 flex-1">
              <p class="text-xs font-bold text-slate-100 truncate">${username}</p>
              <div class="flex items-center gap-1.5 mt-1">
                <select class="role-select text-[11px] bg-slate-900 border border-slate-700 text-indigo-300 rounded-lg px-2 py-0.5">
                  <option value="ami" ${currentRole === 'ami' ? 'selected' : ''}>Ami</option>
                  <option value="invite" ${currentRole === 'invite' ? 'selected' : ''}>Invité</option>
                  <option value="testeur" ${currentRole === 'testeur' ? 'selected' : ''}>Testeur</option>
                  <option value="codeur" ${currentRole === 'codeur' ? 'selected' : ''}>Codeur</option>
                  <option value="programmeur" ${currentRole === 'programmeur' ? 'selected' : ''}>Programmeur</option>
                  <option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button class="reset-btn p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400" title="Réinitialiser MDP">
                <i data-lucide="key" class="w-3.5 h-3.5"></i>
              </button>
              <button class="delete-btn p-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400" title="Supprimer">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          `;

          // Modifier le rôle en direct
          card.querySelector(".role-select").addEventListener("change", async e => {
            const newRole = e.target.value;
            await set(ref(db, `store_users/${key}/role`), newRole);
          });

          // Envoyer e-mail de réinitialisation
          card.querySelector(".reset-btn").addEventListener("click", async () => {
            if (confirm(`Envoyer un e-mail de réinitialisation de mot de passe à ${username} ?`)) {
              try {
                await sendPasswordResetEmail(auth, username);
                alert("E-mail envoyé avec succès !");
              } catch (err) {
                alert("Erreur : " + err.message);
              }
            }
          });

          // Supprimer du répertoire
          card.querySelector(".delete-btn").addEventListener("click", async () => {
            if (confirm(`Retirer ${username} de la base de données ?`)) {
              await remove(ref(db, `store_users/${key}`));
            }
          });

          container.appendChild(card);
        });

        if (window.lucide) lucide.createIcons();
      });
    }

    // CRÉATION COMPLÈTE D'UTILISATEUR (AUTHENTIFICATION + BASE DE DONNÉES)
    $("addUserForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("newUserEmail").value.trim().toLowerCase();
      const password = $("newUserPassword").value;
      const role = $("newUserRole").value;

      if (!email.includes("@")) {
        alert("Saisissez une adresse e-mail valide.");
        return;
      }

      const submitBtn = $("addUserBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Création du compte...";

      try {
        // 1. Création dans Firebase Authentication via l'instance secondaire
        await createUserWithEmailAndPassword(secondaryAuth, email, password);
        // Déconnexion de l'instance secondaire immédiatement
        await signOut(secondaryAuth);

        // 2. Enregistrement des rôles et profil dans Realtime Database
        const key = emailKey(email);
        await set(ref(db, "store_users/" + key), {
          username: email,
          role: role,
          createdAt: Date.now()
        });

        alert(`Compte créé avec succès !\nE-mail : ${email}\nRôle : ${role}`);

        $("newUserEmail").value = "";
        $("newUserPassword").value = "";
      } catch (err) {
        console.error(err);
        if (err.code === "auth/email-already-in-use") {
          alert("Cet e-mail est déjà enregistré dans Firebase.");
        } else if (err.code === "auth/weak-password") {
          alert("Le mot de passe doit contenir au moins 6 caractères.");
        } else {
          alert("Erreur lors de la création : " + err.message);
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="plus-circle" class="w-4 h-4"></i><span>Créer et activer le compte</span>';
        if (window.lucide) lucide.createIcons();
      }
    });

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
